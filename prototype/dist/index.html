<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4657e8" />
    <meta
      name="description"
      content="轻记浏览器交互原型：快速记录、AI 整理与 Mac 桌面小组件体验。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234657e8'/%3E%3Cpath d='M19 18h26v7H19zm0 13h19v7H19zm0 13h13v7H19z' fill='white'/%3E%3C/svg%3E"
    />
    <title>轻记 · 交互原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="app-window" aria-label="轻记应用原型">
        <header class="titlebar">
          <div class="traffic-lights" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p>轻记</p>
          <button class="titlebar-feedback" id="open-feedback" type="button">体验反馈 <span>↗</span></button>
        </header>

        <div class="workspace">
          <aside class="sidebar">
            <a class="brand" href="./" aria-label="轻记首页"><span class="brand-mark" aria-hidden="true">轻</span><span>轻记.</span></a>
            <nav aria-label="记录筛选">
              <button class="nav-item active" data-filter="today" type="button"><span aria-hidden="true">⌂</span>今天<small id="today-count">3</small></button>
              <button class="nav-item" data-filter="unorganized" type="button"><span aria-hidden="true">✦</span>待整理<small id="unorganized-count">1</small></button>
              <button class="nav-item" data-filter="all" type="button"><span aria-hidden="true">□</span>全部记录<small id="all-count">3</small></button>
              <button class="nav-item" data-filter="completed" type="button"><span aria-hidden="true">✓</span>已完成<small id="completed-count">0</small></button>
            </nav>
            <div class="sidebar-bottom">
              <button class="widget-shortcut" id="open-widget" type="button"><span aria-hidden="true">▦</span>桌面小组件<span aria-hidden="true">↗</span></button>
              <div class="sidebar-foot"><span class="status-dot"></span>记录保存在此浏览器</div>
            </div>
          </aside>

          <section class="content">
            <div class="content-heading">
              <div>
                <p class="eyebrow" id="current-date">9 月 17 日 · 星期四</p>
                <h1 id="view-title">今天要记什么？</h1>
              </div>
              <button class="quiet-button" id="focus-capture" type="button">新建记录 <span>⌘N</span></button>
            </div>

            <form class="quick-capture" id="capture-form">
              <label class="sr-only" for="capture-input">快速记录</label>
              <textarea
                id="capture-input"
                rows="3"
                placeholder="直接写下来，不用先整理……"
              ></textarea>
              <div class="capture-tools">
                <div class="type-pills" aria-label="记录类型">
                  <button class="pill active" data-type="auto" type="button" aria-pressed="true">✦ 自动</button>
                  <button class="pill" data-type="task" type="button" aria-pressed="false">任务</button>
                  <button class="pill" data-type="meeting" type="button" aria-pressed="false">会议</button>
                  <button class="pill" data-type="progress" type="button" aria-pressed="false">进展</button>
                  <button class="pill" data-type="need" type="button" aria-pressed="false">需求</button>
                </div>
                <button class="primary-button" type="submit">记下来 <span>⌘↵</span></button>
              </div>
            </form>

            <div class="section-row">
              <h2 id="list-heading">最近记录</h2>
              <span id="visible-count">3 条</span>
            </div>

            <div class="records" id="records" aria-live="polite"></div>
            <div class="empty-state" id="empty-state" hidden><span aria-hidden="true">□</span><h3>这里还没有记录</h3><p>想到什么，就先记下来。</p><button class="secondary-button" id="empty-add" type="button">写一条记录</button></div>
          </section>

          <aside class="detail-panel" id="detail-panel" aria-label="记录详情">
            <div class="detail-head">
              <span id="detail-label">记录详情</span>
              <button class="icon-button" id="close-detail" type="button" aria-label="关闭详情">×</button>
            </div>
            <div id="detail-content"></div>
          </aside>
        </div>
      </section>
    </main>
    <dialog id="widget-dialog" class="preview-dialog">
      <div class="dialog-heading"><div><p class="eyebrow">Mac 桌面预览</p><h2>一眼看见，随手处理。</h2></div><button class="icon-button" data-close="widget-dialog" type="button" aria-label="关闭小组件预览">×</button></div>
      <div class="desktop-preview">
        <div class="desktop-widget"><div class="widget-title"><span>轻记.</span><button id="widget-add" type="button" aria-label="从小组件新建记录">＋</button></div><p class="widget-date" id="widget-date"></p><div id="widget-records"></div><div class="widget-footer"><span id="widget-summary"></span><span>快速记录 ↗</span></div></div>
      </div>
      <p class="dialog-note">点击记录可进入编辑；点击圆圈可完成任务。</p>
    </dialog>

    <dialog id="feedback-dialog" class="feedback-dialog">
      <div class="dialog-heading"><div><p class="eyebrow">体验反馈</p><h2>用起来顺手吗？</h2></div><button class="icon-button" data-close="feedback-dialog" type="button" aria-label="关闭反馈">×</button></div>
      <form id="feedback-form">
        <fieldset class="rating"><legend>这次体验的整体感受</legend><div id="rating-options"></div></fieldset>
        <label class="field-label" for="feedback-text">哪个地方让你停了一下？</label><textarea id="feedback-text" rows="4" placeholder="例如：不知道 AI 整理后会修改哪些内容……"></textarea>
        <button class="primary-button full-width" type="submit">保存反馈</button>
      </form>
      <div class="feedback-success" id="feedback-success" hidden><div class="success-icon">✓</div><h3>反馈已记录</h3><p>复制后发给产品负责人，帮助改进下一版。</p><button class="secondary-button" id="copy-feedback" type="button">复制反馈</button><button class="quiet-button" id="more-feedback" type="button">再写一条</button></div>
      <p class="dialog-note">反馈仅保存在此浏览器，不会自动发送。</p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
